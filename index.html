<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QR Studio</title>
        <link rel="stylesheet" href="./main.css" />
    </head>
    <body>
        <div class="page">
            <!-- WebSide Name: -->
            <div class="name_area">
                <h1>Walcome To QR Studio</h1>
            </div>

            <!-- Inpute Area:  -->
            <div class="input_area">
                <input type="text" placeholder="Enter text or a URL..." />
            </div>

            <!-- QR Code Area:  -->
            <div class="qr_area">
                <div class="qr">QR</div>
            </div>

            <!-- Generate Button Area:  -->
            <div class="gen">
                <button>Generate a QR code</button>
            </div>
            <footer>
                <hr />
                <a href="https://www.instagram.com/akram.ben.chaa/">Akrm Ben Chaa</a>
            </footer>
        </div>
    </body>
    <script src="./script.js"></script>
</html>
